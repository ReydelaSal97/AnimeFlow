<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Servidor demo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:grid;place-items:center;font-family:Outfit,system-ui,sans-serif;
       background:radial-gradient(circle at 30% 20%,#241a3d,#0b0b0f 65%);color:#f4f4f5;text-align:center;padding:24px}
  .box{max-width:460px}
  .play{width:66px;height:66px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
        background:linear-gradient(100deg,#8b5cf6,#22d3ee);box-shadow:0 0 44px rgba(139,92,246,.5);animation:p 2.4s ease-in-out infinite}
  @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  h1{font-size:17px;margin:0 0 6px;font-weight:700}
  .s{display:inline-block;margin-bottom:14px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;
     background:rgba(139,92,246,.18);color:#c4b5fd;border:1px solid rgba(139,92,246,.35)}
  p{font-size:12.5px;line-height:1.65;color:#8b8b96;margin:0}
  code{background:rgba(0,0,0,.45);padding:1px 5px;border-radius:4px;color:#a78bfa;font-size:11.5px}
  .bar{margin-top:20px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:34%;background:linear-gradient(90deg,#8b5cf6,#22d3ee);border-radius:99px}
</style></head>
<body>
  <div class="box">
    <div class="play"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg></div>
    <div class="s" id="srv">Servidor</div>
    <h1 id="ep">Reproductor de demostración</h1>
    <p>Aquí se carga el <em>iframe</em> del servidor externo real.<br>
       Sustituye este marcador por la URL de tu proveedor en la columna
       <code>embed_url</code> de la tabla <code>servidores</code>.</p>
    <div class="bar"><i></i></div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get('s'))  document.getElementById('srv').textContent = p.get('s');
  if (p.get('ep')) document.getElementById('ep').textContent  = (p.get('t') || 'Episodio') + ' ' + p.get('ep');
</script>
</body></html>
